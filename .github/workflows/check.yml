# SPDX-License-Identifier: MIT
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The flake's checks, built on each Linux system the flake supports.
  flake-check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L

  # The checks of the command that need the network: the lock run, the
  # interactive install, the everyday loop and publishing (tests/cli.sh).
  cli:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: bash tests/cli.sh
